[pytest]
testpaths = tests
# Live model tests are opt-in: the default suite stays offline and deterministic.
addopts = -m 'not ollama and not live'
pythonpath = services/api
asyncio_mode = auto
markers =
    browser: needs a real Playwright browser (skipped automatically if unavailable)
    ollama: needs a running Ollama with a pulled model; opt in with -m ollama
    live: hits a real third-party job board over the network; opt in with -m live
filterwarnings =
    ignore::DeprecationWarning
