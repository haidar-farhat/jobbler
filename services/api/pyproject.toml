[project]
name = "localapply"
version = "0.1.0"
description = "Local-first autonomous job-application workstation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "playwright>=1.49",
    "redis>=5.2",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.17",
    # CV import (Phase 2). Both are pure-Python with cp314 wheels.
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Document generation (Phase 3). PDFs are printed by the Chromium that
    # Playwright already installs, so no separate PDF stack is needed.
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "httpx>=0.28",  # ASGI transport for API tests
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localapply"]

# Test configuration lives in the repo-root pytest.ini so `pytest` runs from the root.

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these, and its column definitions run long. Reformatting generated
# files means every future `alembic revision --autogenerate` fails the linter on code
# nobody wrote. Hand-written migrations in here still get read in review.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # `Depends()` / `Query()` in argument defaults IS the FastAPI idiom -- the whole
    # dependency-injection system is built on it. B008 is a real rule for ordinary code and
    # simply does not apply to route handlers.
    "B008",
    # `class Foo(str, Enum)` is deliberate: it keeps the Pydantic v2 serialisation behaviour
    # explicit and matches how the contracts are consumed on the TypeScript side.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
